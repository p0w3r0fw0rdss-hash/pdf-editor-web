<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Editor Online - Gratis</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📄 PDF Editor Online</h1>
    <p>Sube, edita y descarga tus PDFs de forma gratuita</p>
  </header>

  <main>
    <section class="upload-section">
      <label for="pdfFile" class="upload-btn">📁 Subir PDF</label>
      <input type="file" id="pdfFile" accept=".pdf" />
      <span id="fileName">Ningún archivo seleccionado</span>
    </section>

    <section class="toolbar" id="toolbar" style="display:none;">
      <button onclick="setTool('text')">✏️ Añadir texto</button>
      <button onclick="setTool('draw')">✍️ Dibujar</button>
      <button onclick="setTool('highlight')">🟡 Resaltar</button>
      <button onclick="downloadPDF()">💾 Descargar PDF editado</button>
    </section>

    <section class="canvas-container" id="canvasContainer" style="display:none;">
      <canvas id="pdfCanvas"></canvas>
    </section>
  </main>

  <footer>
    <p>Editor 100% gratuito · Funciona directamente en el navegador</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
